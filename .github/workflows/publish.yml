name: Publish

# Publishes to npm via OIDC Trusted Publishing — no long-lived NPM_TOKEN.
#
# Prerequisites (one-time):
#   - A Trusted Publisher configured PER PACKAGE on npmjs.com, pointing at
#     repo `sapiom/sapiom-js` + workflow file `.github/workflows/publish.yml` +
#     environment `npm-publish`. A mismatch (repo/workflow/env) is the usual cause of a publish E404.
#   - Toolchain: Node > 22 and npm >= 11.5 (OIDC support) + a pnpm that supports
#     trusted publishing (pnpm 10+). `packageManager` in package.json must match.
#   - The OIDC grant (below) exists only in the `publish` job, which runs in the
#     `npm-publish` environment: `main` only, with required reviewers. Each
#     package's Trusted Publisher names that environment, so a token minted
#     anywhere else is refused by npm.
#   - The `check` job holds no OIDC grant. It refuses dispatches from other
#     branches and reports whether a public package version is missing from npm;
#     `publish` starts only then or on a `publish_mcp_registry` dispatch, so
#     ordinary pushes to main never wait for an approval.
#
# npm generates provenance attestations automatically under trusted publishing
# (no --provenance flag needed). `changeset publish` runs through pnpm so it
# resolves `workspace:*` to real ranges and only publishes versions not already
# on npm — so this is a safe no-op on pushes that aren't a version-PR merge.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_mcp_registry:
        description: Register the current MCP version even if it is already published to npm
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pending.outputs.pending }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Refuse dispatches from other branches
        run: node scripts/assert-release-ref.mjs

      - name: Check release readiness
        run: node scripts/assert-release-ready.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Find versions not yet on npm
        id: pending
        run: node scripts/release-pending.mjs

  publish:
    needs: check
    # A skipped job requests no environment approval: reviewers are only asked
    # when there is something to publish.
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.check.outputs.pending == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_mcp_registry))
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC: mint the short-lived token npm trades for publish auth

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check release readiness
        run: node scripts/assert-release-ready.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # pnpm version comes from package.json `packageManager` (pnpm 10+ for OIDC).
        # Keep all workflows in sync with it.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm >= 11.5 (OIDC trusted publishing)
        # Pinned to the 11.x line rather than `npm@latest`: npm 12.0.0's
        # publish path fails to resolve its bundled `sigstore` module when
        # generating provenance attestations under trusted publishing
        # ("Cannot find module 'sigstore'"), which aborts `changeset publish`
        # for every package. 11.x (>= the 11.5 OIDC minimum) publishes cleanly.
        run: npm install -g 'npm@^11.5' && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish to npm (OIDC trusted publishing — no token)
        id: publish
        env:
          PUBLISH_MCP_REGISTRY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mcp_registry }}
        run: |
          # Stream output live AND capture it. `set +e` + PIPESTATUS so a failing
          # `changeset publish` doesn't kill the step before we've logged its
          # output and recorded the real exit code — the old `OUTPUT=$(... 2>&1)`
          # form died at the assignment under `set -e`, hiding the actual error
          # (e.g. an E404 from a package with no trusted publisher configured).
          set +e
          pnpm changeset publish 2>&1 | tee publish-output.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$PUBLISH_MCP_REGISTRY" = "true" ] || grep -q "@sapiom/mcp@" publish-output.txt; then
            echo "mcp-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-changed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::changeset publish failed (exit $STATUS) — see output above. A common cause is a new package missing its per-package Trusted Publisher on npmjs.com (E404)."
            exit "$STATUS"
          fi

      # --- MCP registry publish (OIDC via github-oidc) ---
      - name: Sync MCP server.json version
        if: steps.publish.outputs.mcp-changed == 'true'
        working-directory: packages/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      # Pinned and checksummed: this binary runs inside the job that holds the
      # OIDC grant. Bump both values together from the release's checksums file.
      - name: Install mcp-publisher
        if: steps.publish.outputs.mcp-changed == 'true'
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::The pinned mcp-publisher checksum is for linux amd64, not $(uname -m)."
            exit 1
          fi
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        if: steps.publish.outputs.mcp-changed == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP server to registry
        if: steps.publish.outputs.mcp-changed == 'true'
        working-directory: packages/mcp
        run: ../../mcp-publisher publish
