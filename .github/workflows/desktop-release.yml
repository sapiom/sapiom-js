name: Desktop Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract published beta
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/sapiom/sapiom-js/releases/download/v0.4.5-beta.1/Sapiom-Setup-0.4.5-beta.1.exe' -OutFile beta.exe
          7z x beta.exe '-oinstaller-payload' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          $payload = @(Get-ChildItem installer-payload -Recurse -Filter app-64.7z)
          if ($payload.Count -ne 1) { throw "Expected one application payload; found $($payload.Count)" }
          7z x $payload[0].FullName '-obeta-app' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Application extraction failed' }
      - name: Diagnose managed launch
        shell: pwsh
        run: node scripts/release-diagnostics/driver.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-managed-diagnostics
          path: diagnostic-*.json
