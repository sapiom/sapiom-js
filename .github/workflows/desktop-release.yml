name: Desktop Release

# Builds the @sapiom/harness-desktop installers on each OS's own runner and
# attaches them to a GitHub Release. Separate from publish.yml (that ships the
# @sapiom/harness NPM package via OIDC) — desktop installers are a different
# artifact type with a different toolchain (electron-builder + a native
# node-pty rebuild per platform), so they get their own workflow and their own
# tag namespace (`harness-desktop-v*`) that never triggers the npm publish.
#
# Phase 4 = UNSIGNED multi-OS build. macOS is the required shipping target, so
# it's exercised here early (on a hosted macos-14 runner) rather than deferred:
# a `.dmg` that *builds and rebuilds node-pty* on a real Mac is the thing we're
# de-risking. Code signing + notarization (mac) and EV signing (win) come in
# Phases 5–6 and layer on top of this same build.
#
# Trigger:
#   - push a tag `harness-desktop-v1.2.3`  → build all OSes + publish a Release
#   - workflow_dispatch (manual)           → build all OSes, artifacts only
#     (no tag ⇒ no Release; download them from the run's Artifacts).

on:
  push:
    tags:
      - "harness-desktop-v*"
  workflow_dispatch:

# Don't cancel an in-progress release build for the same ref: half-published
# release assets are worse than a slightly stale queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # Build every OS even if one fails — a Linux failure must not hide the
      # macOS result (or vice-versa). Windows is additionally non-blocking below.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packflag: "--linux"
            # The shippable Linux installers.
            artifact_path: |
              packages/harness-desktop/release/*.AppImage
              packages/harness-desktop/release/*.deb
          - os: macos-14 # Apple Silicon; builds an arm64 .app (+ .dmg/.zip)
            packflag: "--mac"
            # The .dmg is what a tester should get: signed + notarized, it opens
            # with no Gatekeeper prompt, and it's a single file rather than a
            # directory whose executable bits upload-artifact would strip. (We
            # previously uploaded the raw .app to dodge the zip-of-installers
            # unwrapping, at the cost of needing `chmod -R +x` + `xattr -dr
            # com.apple.quarantine` by hand — which signing exists to remove.)
            artifact_path: |
              packages/harness-desktop/release/*.dmg
              packages/harness-desktop/release/*.zip
          # Pinned to windows-2022 (VS 2022 / v17). windows-latest rolled to an
          # image with Visual Studio 18, whose version node-gyp's VS detection
          # doesn't recognize ("unknown version undefined") → the node-pty
          # rebuild can't find a usable compiler. VS 2022 is fully supported.
          - os: windows-2022
            packflag: "--win"
            artifact_path: packages/harness-desktop/release/*.exe

    runs-on: ${{ matrix.os }}
    # Windows stays non-blocking while we bring it up (Phase 6). Keep it in the
    # matrix to observe its status, but never let it fail the release. Remove
    # this once Windows is first-class.
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from package.json `packageManager` — keep every
        # workflow in sync with it (same as test.yml / publish.yml).

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) — matches the test.yml matrix. NOT the dev box's Node
          # 26, which breaks Electron's binary extraction + electron-rebuild.
          node-version: "22.x"
          cache: "pnpm"

      - name: Use Python 3.11 (node-gyp needs distutils)
        # electron-builder rebuilds node-pty from source where no matching
        # prebuilt exists (macOS/arm64, Windows). Its bundled node-gyp@9 imports
        # `distutils`, which Python 3.12+ removed (PEP 632) — and the macOS/
        # Windows runners default to 3.12+. Pinning 3.11 (which still ships
        # distutils) fixes the rebuild without upgrading node-gyp. No-op on
        # Linux, which uses node-pty's prebuilt binary and never compiles.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # onlyBuiltDependencies (pnpm-workspace.yaml) lets electron/node-pty/
        # esbuild run their postinstall — electron downloads its binary here.
        run: pnpm install --frozen-lockfile

      - name: Build harness + desktop (topological)
        # `...` builds @sapiom/harness-desktop AND its workspace deps
        # (@sapiom/harness → its dist/web SPA) in dependency order.
        run: pnpm --filter "@sapiom/harness-desktop..." build

      - name: Package installers
        # Invoke pack.mjs directly (not the `dist` script) so we control the
        # platform flag and skip the script's redundant single-package build.
        # electron-builder's npmRebuild recompiles node-pty against the Electron
        # ABI for THIS OS as part of packaging.
        #
        # SIGNING is credential-driven, not branch-driven: add the secrets and the
        # very next tag produces a signed + notarized .dmg; with the secrets empty
        # the same job SKIPS signing and produces a working unsigned build instead
        # of failing. That's why `notarize` is passed on the command line rather
        # than hardcoded in electron-builder.yml — a hardcoded `notarize: true`
        # fails the build when there's nothing to notarize with.
        #
        # `CSC_IDENTITY_AUTO_DISCOVERY: false` IS electron-builder's documented
        # switch for "do not sign", so the skip is explicit, not incidental — and
        # it must be false whenever we have no cert, or electron-builder picks up
        # any identity lying around in the runner's keychain and half-signs.
        #
        # An unset secret still EXPORTS here, as the empty string — and to
        # electron-builder an empty `CSC_LINK` is a *defined* one, so it takes the
        # "a certificate file was provided" path even with auto-discovery off,
        # resolves "" to the cwd, and fails the whole mac build with
        # `⨯ <deploy-dir> not a file`. AUTO_DISCOVERY=false does not save you.
        # The `unset` in the script below is what actually makes the skip work;
        # this is the same empty-string-is-not-absent trap pack.mjs already
        # filters for its passthrough args.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # A plain string, not an array: unquoted it expands to NOTHING when
          # empty, whereas "${arr[@]:-}" would hand pack.mjs an empty argument.
          notarize_flag=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -z "${CSC_LINK:-}" ]; then
              # No certificate → skip signing altogether. UNSET rather than leave
              # them empty: electron-builder treats an empty-but-defined CSC_LINK
              # as a cert path (see the env block above) and fails the build.
              # Unsetting here removes them from pack.mjs's inherited environment,
              # restoring the "no signing env at all" state that built green.
              unset CSC_LINK CSC_KEY_PASSWORD
              echo "macOS signing: SKIPPED — no CSC_LINK secret."
              echo "::warning::Unsigned macOS build: Gatekeeper blocks it on a clean Mac (testers need System Settings → Privacy & Security → Open Anyway). Add the Apple secrets to sign + notarize."
            elif [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              # Cert but no notarization account: signing alone is still a real
              # improvement, and notarizing half-configured would FAIL the build
              # (it calls Apple's service) rather than degrade. Same empty-string
              # hygiene as above, so a half-configured notarization account can't
              # be mistaken for a configured one.
              # APPLE_TEAM_ID is left alone: it can participate in signing identity
              # selection, and only the notarization pair is half-configured here.
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
              echo "macOS signing: signing only — notarization SKIPPED (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD missing)."
              echo "::warning::Signed but not notarized: first launch still shows a Gatekeeper prompt."
            else
              echo "macOS signing: signing + notarizing."
              notarize_flag="-c.mac.notarize=true"
            fi
          fi
          # shellcheck disable=SC2086 # intentional: empty must vanish
          node packages/harness-desktop/scripts/pack.mjs ${{ matrix.packflag }} $notarize_flag

      - name: List built artifacts
        # `shell: bash` runs under git-bash on the Windows runner too, so one ls works.
        shell: bash
        run: ls -la packages/harness-desktop/release

      # Release gate — macOS ONLY.
      #
      # Linux: skipped because the PR job (test.yml → desktop-smoke) already
      # packages and launches it on every pull request. Nothing new to learn.
      #
      # Windows: skipped because it is KNOWN broken — the packaged app exits 3
      # before running any of its own code (this gate is what found that), so a
      # run here only adds a guaranteed red X to every release build. Re-enable
      # by widening this condition once the launch bug is fixed (Phase 6);
      # until then Windows genuinely has no launch coverage, which is accurate
      # rather than hidden.
      #
      # macOS: kept, and not redundant with the PR job, for two reasons — the PR
      # job cannot build a macOS app at all (it needs its own runner), and the
      # artifact here is SIGNED and notarized, which the PR's never is. Signing
      # changes the binary: hardened runtime and entitlements can break an app
      # that launches perfectly unsigned (library validation vs. node-pty's
      # spawn-helper is the classic case), so "it ran unsigned in the PR" is not
      # evidence that the notarized .dmg a tester downloads will run.
      - name: Smoke-launch the packaged app
        if: runner.os == 'macOS'
        shell: bash
        run: packages/harness-desktop/scripts/smoke.sh

      # Always upload to the run's Artifacts so workflow_dispatch (untagged)
      # builds are downloadable and testable — this is how you grab the unsigned
      # macOS app to test on a Mac before signing exists. Each OS uploads only
      # its own binary (see matrix.artifact_path); macOS ships the raw .app so the
      # download is the binary directly, not a zip of installers.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 14

  # Collect every OS's artifacts and attach them to the GitHub Release — only
  # on a real tag push (workflow_dispatch has no tag, so it stops at Artifacts).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/harness-desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub Release and upload assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Pre-release while Windows is unsigned (and currently non-launching).
          prerelease: true
          fail_on_unmatched_files: false
          # Every OS now uploads installer FILES only (macOS: .dmg/.zip, not the
          # raw .app bundle), so this glob attaches a handful of assets rather
          # than the hundreds of inner files an .app directory would produce.
          files: dist-artifacts/**/*
          body: |
            Desktop installers built by CI. Each one was **launched by CI before
            being attached** (`--smoke`: the app boots, serves the SPA from inside
            the asar, spawns a PTY, and its preload bridge loads).

            | Platform | Status |
            | --- | --- |
            | macOS (Apple Silicon) | `.dmg` — signed + notarized when Apple credentials are configured; otherwise unsigned (Gatekeeper will ask for right-click → Open) |
            | Linux | `.AppImage` / `.deb` |
            | Windows | `.exe` — **unsigned, and a known launch bug is open**; SmartScreen will warn |

            Intel Macs are not covered yet: CI builds arm64 only.
