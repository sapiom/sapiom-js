name: Desktop Release

# Builds the @sapiom/harness-desktop installers on each OS's own runner and
# attaches them to a GitHub Release. Separate from publish.yml (that ships the
# @sapiom/harness NPM package via OIDC) — desktop installers are a different
# artifact type with a different toolchain (electron-builder + a native
# node-pty rebuild per platform), so they get their own workflow and their own
# tag namespace (`harness-desktop-v*`) that never triggers the npm publish.
#
# Phase 4 = UNSIGNED multi-OS build. macOS is the required shipping target, so
# it's exercised here early (on a hosted macos-14 runner) rather than deferred:
# a `.dmg` that *builds and rebuilds node-pty* on a real Mac is the thing we're
# de-risking. Code signing + notarization (mac) and EV signing (win) come in
# Phases 5–6 and layer on top of this same build.
#
# Trigger, and the tag convention that drives the update channel:
#   - `harness-desktop-v1.2.3`        → FINAL release, `latest` channel. Every user
#                                       gets it, and it becomes the target of the
#                                       permanent /releases/latest/download/… links.
#   - `harness-desktop-v1.2.3-beta.1` → PRE-release, `beta` channel. Only installs
#                                       already following betas are offered it.
#   - workflow_dispatch (manual)      → build all OSes, artifacts only
#                                       (no tag ⇒ no Release; download them from
#                                       the run's Artifacts).
#
# The tag must match `packages/harness-desktop/package.json`'s version exactly —
# the `prepare` job enforces it, because that field is what names the artifacts and
# what the installed app reports as its own version.

on:
  push:
    tags:
      - "harness-desktop-v*"
  workflow_dispatch:

# Minimal token scope, declared at the top so it is the DEFAULT every job
# inherits — including any job added later. `build` only reads the checked-out
# code (upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` scope); the `release` job overrides
# this with `contents: write` at its own level, which is the only place a
# write-scoped token exists in this workflow.
permissions:
  contents: read

# Don't cancel an in-progress release build for the same ref: half-published
# release assets are worse than a slightly stale queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve version/channel ONCE, and fail fast on a bad tag.
  #
  # Separate job on purpose: the guard below costs ~15 seconds, and catching a
  # version mismatch here means we haven't already spent 40 minutes of macOS
  # notarization on an artifact we're going to throw away. Three matrix legs
  # computing the same thing three times would also be three chances to disagree.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and update channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/harness-desktop/package.json').version")"

          # THE source of truth is package.json, not the tag. electron-builder
          # names every artifact from it, and the installed app derives its own
          # channel from app.getVersion() — which is the same field (see
          # src/main/update-policy.ts). Deriving the channel here from anything
          # else would let the artifact and the app that runs it disagree.
          #
          # Strip build metadata before looking for a pre-release tag: `0.1.2+pr-44`
          # is a FINAL release whose metadata happens to contain a hyphen.
          #
          # `*-?*`, not `*-*`: the hyphen must be FOLLOWED by something. A trailing
          # hyphen (`0.1.2-`) is not a pre-release, and update-policy.ts's
          # `/^\d+\.\d+\.\d+-\S/` agrees — matching on a bare `*-*` here made the
          # two derivations disagree on that one input, which the metadata check
          # below would catch as a confusing red build rather than a bad release.
          core="${version%%+*}"
          case "$core" in
            *-?*) channel=beta;    prerelease=true  ;;
            *)    channel=latest;  prerelease=false ;;
          esac

          # A tag that disagrees with package.json is the one mistake that breaks
          # updates permanently and silently: electron-builder writes the artifact
          # names and `latest.yml` from package.json, so the release would advertise
          # a version that no asset matches (or, worse, one the installed app
          # already has) and every client would re-offer the same update forever.
          # We have already tagged v0.1.0 against a package that later became
          # 0.1.1 — this is a mistake we've made, not one we're imagining.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            expected="harness-desktop-v${version}"
            if [ "${{ github.ref_name }}" != "$expected" ]; then
              echo "::error::Tag '${{ github.ref_name }}' does not match packages/harness-desktop/package.json (${version}). Expected '${expected}'. Bump the package version or retag."
              exit 1
            fi
          fi

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "channel=$channel"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version on the \"$channel\" channel (prerelease=$prerelease)."

  build:
    needs: prepare
    strategy:
      # Build every OS even if one fails — a Linux failure must not hide the
      # macOS result (or vice-versa). Windows is additionally non-blocking below.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packflag: "--linux"
            # Suffix of the update manifest this OS produces; the channel is
            # prefixed at check time (latest-linux.yml / beta-linux.yml).
            metadata_suffix: "-linux.yml"
            # The shippable Linux installers, PLUS the update manifest.
            #
            # The manifest globs are not optional extras: without them
            # electron-builder generates the metadata and this step throws it
            # away, producing a release that looks complete and silently breaks
            # every future update. `latest*`/`beta*` rather than `*.yml` so
            # builder-debug.yml doesn't get attached to a public release.
            #
            # No .blockmap on Linux — the AppImage embeds its own block map, so
            # there is no separate file to collect (unlike the NSIS .exe).
            artifact_path: |
              packages/harness-desktop/release/*.AppImage
              packages/harness-desktop/release/*.deb
              packages/harness-desktop/release/latest*.yml
              packages/harness-desktop/release/beta*.yml
          - os: macos-14 # Apple Silicon; builds an arm64 .app → .dmg
            packflag: "--mac"
            # The .dmg is what a tester should get: signed + notarized, it opens
            # with no Gatekeeper prompt, and it's a single file rather than a
            # directory whose executable bits upload-artifact would strip. (We
            # previously uploaded the raw .app to dodge the zip-of-installers
            # unwrapping, at the cost of needing `chmod -R +x` + `xattr -dr
            # com.apple.quarantine` by hand — which signing exists to remove.)
            #
            metadata_suffix: "-mac.yml"
            # .dmg for humans, .zip for Squirrel.Mac. The zip is what the updater
            # actually downloads — macOS auto-update cannot consume a dmg — and
            # `latest-mac.yml` is only written when a zip target exists. It was
            # deliberately dropped while there was no updater (it was just a second
            # copy of the same .app); it is now load-bearing.
            artifact_path: |
              packages/harness-desktop/release/*.dmg
              packages/harness-desktop/release/*.zip
              packages/harness-desktop/release/latest*.yml
              packages/harness-desktop/release/beta*.yml
              packages/harness-desktop/release/*.blockmap
          # Pinned to windows-2022 (VS 2022 / v17). windows-latest rolled to an
          # image with Visual Studio 18, whose version node-gyp's VS detection
          # doesn't recognize ("unknown version undefined") → the node-pty
          # rebuild can't find a usable compiler. VS 2022 is fully supported.
          - os: windows-2022
            packflag: "--win"
            # Windows' manifest is unsuffixed: latest.yml / beta.yml.
            metadata_suffix: ".yml"
            # The .exe.blockmap is what makes differential updates work: without it
            # attached, electron-updater silently falls back to downloading the
            # whole ~100 MB installer instead of the few MB that changed.
            artifact_path: |
              packages/harness-desktop/release/*.exe
              packages/harness-desktop/release/*.blockmap
              packages/harness-desktop/release/latest*.yml
              packages/harness-desktop/release/beta*.yml

    runs-on: ${{ matrix.os }}
    # Windows stays non-blocking while we bring it up (Phase 6). Keep it in the
    # matrix to observe its status, but never let it fail the release. Remove
    # this once Windows is first-class.
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    # 75, not 40: macOS notarization is the long pole and Apple's turnaround has
    # been measured at 30+ minutes on this account (see the Package installers
    # step). The job cap MUST exceed that step's own cap or the step timeout can
    # never fire and the diagnostic never runs — which is exactly how three
    # successful notarizations got thrown away.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from package.json `packageManager` — keep every
        # workflow in sync with it (same as test.yml / publish.yml).

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) — matches the test.yml matrix. NOT the dev box's Node
          # 26, which breaks Electron's binary extraction + electron-rebuild.
          node-version: "22.x"
          cache: "pnpm"

      - name: Use Python 3.11 (node-gyp needs distutils)
        # electron-builder rebuilds node-pty from source where no matching
        # prebuilt exists (macOS/arm64, Windows). Its bundled node-gyp@9 imports
        # `distutils`, which Python 3.12+ removed (PEP 632) — and the macOS/
        # Windows runners default to 3.12+. Pinning 3.11 (which still ships
        # distutils) fixes the rebuild without upgrading node-gyp. No-op on
        # Linux, which uses node-pty's prebuilt binary and never compiles.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # onlyBuiltDependencies (pnpm-workspace.yaml) lets electron/node-pty/
        # esbuild run their postinstall — electron downloads its binary here.
        run: pnpm install --frozen-lockfile

      - name: Build harness + desktop (topological)
        # `...` builds @sapiom/harness-desktop AND its workspace deps
        # (@sapiom/harness → its dist/web SPA) in dependency order.
        run: pnpm --filter "@sapiom/harness-desktop..." build

      - name: Package installers
        # Packaging alone takes ~1 minute (unsigned macOS runs: 31s–64s) and
        # signing adds seconds; everything beyond that is Apple's notary service,
        # which `notarytool submit --wait` blocks on with no timeout of its own.
        #
        # 45 minutes because Apple's measured turnaround on this account is 30+
        # minutes, not the 5–15 the docs suggest. Three earlier runs were killed
        # at 25–33 minutes while submissions were still "In Progress" — and
        # `notarytool history` later showed every one of them had come back
        # Accepted. The app was never the problem; the timeout was. Keep this
        # comfortably above observed latency, and below the job cap so a genuine
        # hang still fails here (leaving budget for the diagnostic) rather than
        # killing the whole job.
        timeout-minutes: 45
        # Invoke pack.mjs directly (not the `dist` script) so we control the
        # platform flag and skip the script's redundant single-package build.
        # electron-builder's npmRebuild recompiles node-pty against the Electron
        # ABI for THIS OS as part of packaging.
        #
        # SIGNING is credential-driven, not branch-driven: add the secrets and the
        # very next tag produces a signed + notarized .dmg; with the secrets empty
        # the same job SKIPS signing and produces a working unsigned build instead
        # of failing. That's why `notarize` is passed on the command line rather
        # than hardcoded in electron-builder.yml — a hardcoded `notarize: true`
        # fails the build when there's nothing to notarize with.
        #
        # `CSC_IDENTITY_AUTO_DISCOVERY: false` IS electron-builder's documented
        # switch for "do not sign", so the skip is explicit, not incidental — and
        # it must be false whenever we have no cert, or electron-builder picks up
        # any identity lying around in the runner's keychain and half-signs.
        #
        # An unset secret still EXPORTS here, as the empty string — and to
        # electron-builder an empty `CSC_LINK` is a *defined* one, so it takes the
        # "a certificate file was provided" path even with auto-discovery off,
        # resolves "" to the cwd, and fails the whole mac build with
        # `⨯ <deploy-dir> not a file`. AUTO_DISCOVERY=false does not save you.
        # The `unset` in the script below is what actually makes the skip work;
        # this is the same empty-string-is-not-absent trap pack.mjs already
        # filters for its passthrough args.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # A plain string, not an array: unquoted it expands to NOTHING when
          # empty, whereas "${arr[@]:-}" would hand pack.mjs an empty argument.
          notarize_flag=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -z "${CSC_LINK:-}" ]; then
              # No certificate → skip signing altogether. UNSET rather than leave
              # them empty: electron-builder treats an empty-but-defined CSC_LINK
              # as a cert path (see the env block above) and fails the build.
              # Unsetting here removes them from pack.mjs's inherited environment,
              # restoring the "no signing env at all" state that built green.
              unset CSC_LINK CSC_KEY_PASSWORD
              echo "macOS signing: SKIPPED — no CSC_LINK secret."
              echo "::warning::Unsigned macOS build: Gatekeeper blocks it on a clean Mac (testers need System Settings → Privacy & Security → Open Anyway). Add the Apple secrets to sign + notarize."
            elif [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              # Cert but no notarization account: signing alone is still a real
              # improvement, and notarizing half-configured would FAIL the build
              # (it calls Apple's service) rather than degrade. Same empty-string
              # hygiene as above, so a half-configured notarization account can't
              # be mistaken for a configured one.
              # APPLE_TEAM_ID is left alone: it can participate in signing identity
              # selection, and only the notarization pair is half-configured here.
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
              echo "macOS signing: signing only — notarization SKIPPED (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD missing)."
              echo "::warning::Signed but not notarized: first launch still shows a Gatekeeper prompt."
            else
              echo "macOS signing: signing + notarizing."
              notarize_flag="-c.mac.notarize=true"
            fi
          fi
          # The channel is NOT passed from here. pack.mjs derives it from
          # package.json using the app's own update-policy rule, so this workflow,
          # the PR smoke job in test.yml, and a local `pnpm dist` all agree without
          # three copies of "does this version have a pre-release tag?" in bash.
          # The `prepare` job's channel output is then an independent expectation,
          # and the metadata check below is what catches the two disagreeing.
          # shellcheck disable=SC2086 # intentional: empty must vanish
          node packages/harness-desktop/scripts/pack.mjs ${{ matrix.packflag }} $notarize_flag

      # Ask Apple what actually happened, on the runner that has notarytool.
      # Runs even when packaging failed — that is precisely when it's needed:
      # a submission that timed out here may still have completed on Apple's
      # side, and an `Invalid` verdict carries a log explaining exactly which
      # binary or entitlement Apple rejected. Without this the only signal is
      # "the step hung", which is not a diagnosis.
      - name: Notarization history (diagnostic)
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "no notarization credentials — nothing to query"; exit 0
          fi
          # Queried once and reused — two calls would be two round-trips to Apple
          # for the same answer.
          history="$(xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                     --password "$APPLE_APP_SPECIFIC_PASSWORD" 2>&1)"
          echo "--- recent submissions ---"
          echo "$history" | head -40
          # Apple's verdict on the newest submission, with the rejection reasons
          # when it is Invalid.
          id="$(echo "$history" | awk '/id:/ {print $2; exit}')"
          if [ -n "${id:-}" ]; then
            echo "--- log for submission $id ---"
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" 2>&1 | head -60
          fi

      - name: List built artifacts
        # `shell: bash` runs under git-bash on the Windows runner too, so one ls works.
        shell: bash
        run: ls -la packages/harness-desktop/release

      # Fail here rather than ship a release that can never update anything.
      #
      # The manifest is the entire auto-update contract, and its absence is
      # invisible: the installers build, launch, and pass smoke. Every plausible
      # way to lose it is a silent one — dropping the `publish` block from
      # electron-builder.yml, a deploy dir that didn't receive the config, or
      # electron-builder changing when it decides to emit metadata. So assert it
      # exists, and assert the version inside it matches what we think we built
      # (a mismatch makes clients re-offer the same update forever).
      - name: Verify update metadata was generated
        shell: bash
        run: |
          set -euo pipefail
          manifest="packages/harness-desktop/release/${{ needs.prepare.outputs.channel }}${{ matrix.metadata_suffix }}"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is missing — auto-update would be dead in this build. Check the 'publish' block in electron-builder.yml."
            ls -la packages/harness-desktop/release
            exit 1
          fi
          echo "--- $manifest ---"
          cat "$manifest"
          expected="${{ needs.prepare.outputs.version }}"
          if ! grep -qx "version: ${expected}" "$manifest"; then
            echo "::error::$manifest does not advertise version ${expected}."
            exit 1
          fi
          echo "Update manifest OK: $(basename "$manifest") advertises ${expected}."

      # Release gate: launch the packaged app on the OSes only this workflow builds.
      #
      # Linux: skipped because the PR job (test.yml → desktop-smoke) already
      # packages and launches it on every pull request. Nothing new to learn.
      #
      # Windows: re-enabled. It was skipped while the packaged app exited 3
      # before running any of its own code — a guaranteed red X on every build.
      # That is fixed (win.asar: false; an ESM entry cannot load from inside
      # app.asar on Windows), so the gate is back on and Windows has real launch
      # coverage again.
      #
      # macOS: kept, and not redundant with the PR job, for two reasons — the PR
      # job cannot build a macOS app at all (it needs its own runner), and the
      # artifact here is SIGNED and notarized, which the PR's never is. Signing
      # changes the binary: hardened runtime and entitlements can break an app
      # that launches perfectly unsigned (library validation vs. node-pty's
      # spawn-helper is the classic case), so "it ran unsigned in the PR" is not
      # evidence that the notarized .dmg a tester downloads will run.
      # Windows only, and only to check shim FIDELITY: the smoke run spawns a stub
      # shim we wrote ourselves, which proves the mechanism but validates our own
      # assumption about npm's shim format. With a real `claude.cmd` on disk, the
      # `agent-shim` check asserts our parser handles the genuine article — the
      # difference between "our test passes" and "users can start a session".
      # Installing needs no auth.
      #
      # NOT continue-on-error, and SAPIOM_SMOKE_REQUIRE_AGENT makes the check fail
      # rather than skip: this is the only validation against npm's real output, and
      # a tolerated install failure would ship a green release whose sole evidence
      # of missing coverage is one SKIP line.
      - name: Install a real coding agent (Windows shim fidelity)
        if: runner.os == 'Windows'
        run: |
          npm install -g @anthropic-ai/claude-code
          where claude

      - name: Smoke-launch the packaged app
        if: runner.os != 'Linux'
        shell: bash
        env:
          SAPIOM_SMOKE_REQUIRE_AGENT: ${{ runner.os == 'Windows' && '1' || '' }}
        run: packages/harness-desktop/scripts/smoke.sh

      # Always upload to the run's Artifacts so workflow_dispatch (untagged)
      # builds are downloadable and testable — this is how you grab the unsigned
      # macOS app to test on a Mac before signing exists. Each OS uploads only
      # its own binary (see matrix.artifact_path); macOS ships the raw .app so the
      # download is the binary directly, not a zip of installers.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 14
          # Every uploaded file (.dmg/.AppImage/.deb/.exe) is already a
          # compressed container, so the default level-6 zip wrapper burns
          # runner CPU on the upload for ≈0 size gain. Store, don't recompress.
          compression-level: 0

  # Collect every OS's artifacts and attach them to the GitHub Release — only
  # on a real tag push (workflow_dispatch has no tag, so it stops at Artifacts).
  release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/harness-desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub Release and upload assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      # Stable filenames, so a permanent download link exists.
      #
      # GitHub's only stable URL is
      #   /releases/latest/download/<EXACT-FILENAME>
      # — there is no wildcard, so a versioned name like Sapiom-0.1.0-arm64.dmg
      # can never be linked to permanently. These are COPIES, not renames: the
      # versioned assets stay attached for archival and support ("which build are
      # you on?"), and each also appears under a name that never changes.
      #
      # Note the other half of the contract: /releases/latest resolves to the
      # latest NON-prerelease. While `prerelease: true` below, these links 404 —
      # they start working the moment a release ships as final.
      - name: Add stable-named copies for permanent links
        run: |
          set -euo pipefail
          cd dist-artifacts
          shopt -s nullglob globstar
          for f in **/*.dmg;      do cp "$f" "Sapiom-macOS-arm64.dmg";      break; done
          for f in **/*.AppImage; do cp "$f" "Sapiom-Linux-x86_64.AppImage"; break; done
          for f in **/*.deb;      do cp "$f" "Sapiom-Linux-amd64.deb";      break; done
          for f in **/*.exe;      do cp "$f" "Sapiom-Windows-x64.exe";      break; done
          ls -la

      # Refuse to publish a release that cannot update the apps already out there.
      #
      # The per-OS `Verify update metadata` step already fails a build with no
      # manifest — but the Windows leg is `continue-on-error` while Phase 6 is open,
      # and `fail_on_unmatched_files: false` below tolerates anything missing. Those
      # two together route around that check: a final release could publish with no
      # `latest.yml`, and every INSTALLED Windows app would then 404 on every check
      # until the next release. Silent, and unfixable for anyone who already has it.
      #
      # So assert it once more here, where all three OSes' artifacts are together.
      # Windows may still FAIL to build (that stays non-blocking) — this only says
      # that whatever we attach must be internally consistent.
      - name: Verify every platform's update manifest is present
        run: |
          set -euo pipefail
          cd dist-artifacts
          channel="${{ needs.prepare.outputs.channel }}"
          missing=()
          for suffix in ".yml" "-mac.yml" "-linux.yml"; do
            # `find`, not a glob: download-artifact nests each OS in its own dir.
            if [ -z "$(find . -name "${channel}${suffix}" -print -quit)" ]; then
              missing+=("${channel}${suffix}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing update manifest(s): ${missing[*]}. Publishing would leave already-installed apps unable to find any future update. Fix the failing platform, or cut the release without it deliberately."
            find . -name "*.yml" -print
            exit 1
          fi
          echo "All three channel manifests present for \"$channel\"."

      # Make the channels a hierarchy rather than two dead ends.
      #
      # A beta install reads `beta.yml`. Final releases only publish `latest*.yml`,
      # so without this a tester who installed a beta would be stranded the moment
      # we stopped cutting betas: their manifest simply stops existing and every
      # check 404s. Copying the stable manifest under the beta name means they roll
      # forward onto the stable build — which is what "beta gets betas AND newer
      # finals" has to mean in practice.
      #
      # The copy is sound because the manifest names no channel: it holds a version,
      # the file list, and sha512s (verified in release/latest-linux.yml). Only the
      # FILENAME distinguishes channels.
      #
      # Beta releases deliberately do not get the reverse treatment: they publish
      # only `beta*.yml`, and a stable install (allowPrerelease=false) skips
      # pre-releases outright, so it can never be offered one.
      - name: Mirror stable manifests onto the beta channel
        if: needs.prepare.outputs.channel == 'latest'
        run: |
          set -euo pipefail
          cd dist-artifacts
          shopt -s nullglob globstar
          for f in **/latest.yml **/latest-mac.yml **/latest-linux.yml; do
            base="$(basename "$f")"
            cp "$f" "beta${base#latest}"
            echo "mirrored $base → beta${base#latest}"
          done
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Driven by the version, not hardcoded: `0.1.2-beta.1` publishes a
          # pre-release on the beta channel, `0.1.2` publishes a final one. This is
          # also what makes the permanent /releases/latest/download/… links resolve
          # — GitHub points "latest" at the newest NON-prerelease, so while every
          # release was marked pre-release those links 404'd.
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          fail_on_unmatched_files: false
          # Every OS uploads installer FILES only (macOS: .dmg/.zip, not the raw
          # .app bundle), so this glob attaches a handful of assets rather than
          # the hundreds of inner files an .app directory would produce. The
          # `latest*.yml` / `beta*.yml` manifests and `.blockmap` files ride along —
          # they are not optional decoration, they ARE the update mechanism.
          files: dist-artifacts/**/*
          body: |
            Desktop installers built by CI. Each one was **launched by CI before
            being attached** (`--smoke`: the app boots, serves the SPA from inside
            the asar, spawns a PTY, its preload bridge loads, and its auto-update
            config is present).

            Channel: **${{ needs.prepare.outputs.channel }}** (v${{ needs.prepare.outputs.version }}).

            | Platform | Status |
            | --- | --- |
            | macOS (Apple Silicon) | `.dmg` — signed + notarized when Apple credentials are configured; otherwise unsigned (Gatekeeper will ask for right-click → Open) |
            | Linux | `.AppImage` / `.deb` |
            | Windows | `.exe` — **unsigned**; SmartScreen will warn |

            **Updating:** an installed app checks for new releases on its own
            channel and offers a restart when one has downloaded — you should not
            need to reinstall again. Restarting ends any running agent sessions, so
            it always asks first.

            - `.zip` (macOS) and `.blockmap` (Windows) are update artifacts, not
              downloads — take the `.dmg` / `.exe`.
            - Windows updates run an unsigned installer until code signing lands,
              so SmartScreen warns on each update.
            - An `.AppImage` can only self-update while running as the AppImage;
              `.deb` updates go through the system package manager and will ask for
              your password.

            Intel Macs are not covered yet: CI builds arm64 only.
