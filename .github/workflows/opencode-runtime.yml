name: Owned OpenCode runtime

on:
  pull_request:
    paths:
      - "packages/opencode/native-runtime.json"
      - "patches/opencode/**"
      - "scripts/opencode-runtime/**"
      - ".github/workflows/opencode-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: python3 -m unittest discover -s scripts/opencode-runtime -p 'test_*.py'
      - run: python3 scripts/opencode-runtime/build.py --work-dir "$RUNNER_TEMP/opencode-build"
      - run: |
          python3 scripts/opencode-runtime/pack.py --work-dir "$RUNNER_TEMP/opencode-build" --output-dir "$RUNNER_TEMP/runtime-artifacts" --download-cache "$RUNNER_TEMP/opencode-build/downloads"
          node scripts/opencode-runtime/installer.test.mjs "$RUNNER_TEMP/runtime-artifacts/postinstall.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-runtime-candidate
          path: ${{ runner.temp }}/runtime-artifacts
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
