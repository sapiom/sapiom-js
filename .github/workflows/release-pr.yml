name: Release PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from package.json `packageManager` (pnpm 10+)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          # Runs `changeset version`, then regenerates the scaffold VERSION_FALLBACK
          # and syncs pnpm-lock.yaml — so the version PR carries the bumped packages,
          # the regenerated fallback, and an up-to-date lockfile in one commit, and
          # `main` never lands with a stale lockfile / drifted fallback again.
          version: pnpm run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
