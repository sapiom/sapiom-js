name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal token scope: these jobs only read the checked-out code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from package.json `packageManager` (pnpm 10+)

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Template gallery gate. The `examples/` tree lives outside the pnpm workspace,
  # so the matrix job above never touches it — this is the only check that
  # validates examples/registry.json (schema + sort + sourcePath + checkpoints)
  # and every co-located template.json manifest on a PR.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate examples registry and manifests
        run: pnpm examples:check

      - name: Check Agent Studio visible terminology
        run: pnpm terminology:check

      # Fixture tests for the gate itself: a typo'd declaration field must fail
      # rather than be silently stripped downstream. This glob also runs the
      # terminology guard's forbidden-copy, compatibility, and stale-allowlist
      # fixtures.
      - name: Test repository content checks
        run: pnpm examples:check:test

  # NOTE: the harness web-e2e (playwright-mock) and desktop packaging
  # (desktop-smoke) jobs moved to .github/workflows/harness.yml, which is
  # path-filtered to the harness and its workspace dependencies — they only
  # exercise the harness, so running them on every PR wasted CI on changes
  # that can't affect them.
