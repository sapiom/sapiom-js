appId: ai.sapiom.harness
productName: Sapiom
copyright: Copyright © Sapiom
# Pinned because packaging runs against a `pnpm deploy --prod` dir that has no
# `electron` devDep for electron-builder to infer the version from. Keep in sync
# with the `electron` devDependency.
electronVersion: 33.4.11

# Custom URL scheme for web→desktop deep links (the dashboard's "Open in Studio").
# Populates macOS CFBundleURLTypes (Info.plist) and the Linux .desktop MimeType.
# Windows registration is runtime-only, via app.setAsDefaultProtocolClient (index.ts).
protocols:
  - name: Sapiom
    schemes:
      - sapiom

directories:
  output: release
  buildResources: assets

# Auto-update metadata. This block is NOT here to upload anything — the release
# workflow attaches assets itself (softprops/action-gh-release), and pack.mjs
# passes `--publish never` so electron-builder never races it.
#
# It is here because a publish provider is what makes electron-builder
#   (a) emit `latest.yml` / `latest-mac.yml` / `latest-linux.yml` — the manifests
#       electron-updater reads to learn a newer version exists, and
#   (b) bake `resources/app-update.yml` into the app — how the INSTALLED app knows
#       where to look.
# Without it the build succeeds, the app runs, and updates silently never happen.
# The packaged `update-config` smoke check exists to catch exactly that.
#
# The repo is public, so the app needs no token to read releases.
publish:
  provider: github
  owner: sapiom
  repo: sapiom-js

# Default file globbing packs production node_modules + package.json. We add
# our built output explicitly and keep source/maps out of the bundle.
files:
  - "dist/**/*"
  - "package.json"
  - "!**/*.map"
  - "!**/*.ts"

asar: true
# Unpack ALL node_modules. The harness's Canvas check spawns a subprocess under
# ELECTRON_RUN_AS_NODE=1 — plain Node with NO asar support — that imports
# @sapiom/agent-core and its full transitive tree (@sapiom/agent, zod, esbuild,
# …) and bundles the workflow. Plain Node can only resolve files that exist on
# disk, so the entire dependency tree must be unpacked, not just @sapiom/*.
# (Also covers node-pty's spawn-helper, which must be chmod'd +x / exec'd, and
# makes packageRoot()/webDir real on-disk dirs.) The app's own dist/ stays
# packed in app.asar.
asarUnpack:
  - "**/node_modules/**"

# Rebuild node-pty against Electron's ABI during packaging.
npmRebuild: true
electronLanguages:
  - en-US

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: assets/icon.png
  # Clean artifact + package name (the npm name "@sapiom/harness-desktop" is an
  # invalid .deb name and produces a bad "release/@sapiom/…" path).
  artifactName: sapiom-${version}-${arch}.${ext}
  executableName: sapiom
  maintainer: Sapiom <team@sapiom.ai>
  synopsis: Agent Studio — run your coding agent on Sapiom.

mac:
  # dmg AND zip. The zip is not a duplicate download for testers — it is the
  # auto-update artifact: Squirrel.Mac consumes a zip, never a dmg, and
  # `latest-mac.yml` is only written when a zip target exists. Without it the
  # installed app fails every check with "Could not get latest version".
  #
  # (It genuinely was dead weight before — Phase 4 had no updater and no publish
  # provider, so it was a second copy of the same .app. That is what changed.)
  #
  # Squirrel.Mac also requires the update to be validly SIGNED before it will
  # apply it, so macOS auto-update only became possible once the Developer ID
  # cert landed. An unsigned build still installs by hand; it just cannot update.
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # macOS gets its own artwork: the same mark inset to ~82% of the canvas with a
  # transparent margin, per Apple's icon grid, so the app sits the same visual
  # size as its neighbours in the Dock. A full-bleed tile (correct on Linux and
  # Windows) reads as conspicuously oversized next to system apps.
  icon: assets/icon-mac.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  # notarize: set true + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID in Phase 5.

win:
  target:
    - nsis
  icon: assets/icon.png
  # Windows cannot load an ESM entry point from inside app.asar. The app is
  # `type: module` with `main: dist/main/index.js`, and Electron resolves that
  # entry as a file URL — which fails under a drive letter, so the process died
  # with exit 3 (Node's "Internal JavaScript Parse Failure") before any of our
  # code ran, printing nothing anywhere. Linux and macOS are unaffected and keep
  # asar on. Confirmed by experiment, not inference: the same build repacked
  # with `-c.asar=false` launched and passed the full smoke suite 6/6.
  #
  # The cost is close to zero: `asarUnpack: **/node_modules/**` already unpacks
  # everything, so the archive only ever held our own dist/ and package.json —
  # a few hundred KB, next to 100+ MB of already-unpacked node_modules.
  asar: false

nsis:
  # Space-free, so the on-disk name survives GitHub's upload sanitisation
  # unchanged and matches the `url` electron-builder writes into `latest.yml`.
  # The default `${productName} Setup ${version}.${ext}` has a space: builder
  # sanitises that to a hyphen in the manifest, GitHub rewrites it to a dot in
  # the asset, and the two disagree — every Windows client then 404s on update.
  artifactName: Sapiom-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Differential updates: ship only the changed blocks instead of the whole
  # installer. The app is ~100 MB and a typical harness fix touches a few MB of
  # JS, so this is the difference between a background download nobody notices
  # and one they do. Requires the generated `.exe.blockmap` to be attached to the
  # release alongside the installer (see the artifact globs in
  # desktop-release.yml) — without it electron-updater silently falls back to the
  # full download.
  #
  # `perMachine: false` above matters here too: a per-user install updates without
  # a UAC prompt. (The installer is still unsigned until the EV cert lands, so
  # SmartScreen will warn regardless — Phase 6.)
  differentialPackage: true
