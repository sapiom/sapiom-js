<!doctype html>
<!-- data-product scopes the design-system's named "sapiom-studio" preset
     (compact IDE density, scarce green brand, neutral focus/selection). -->
<html lang="en" data-product="sapiom-studio">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Studio</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong one.
      // Storage key + resolution must match web/src/lib/theme.ts (this can't
      // import it): a stored choice wins, otherwise default to light.
      (function () {
        var stored = localStorage.getItem("sapiom-harness-theme");
        var theme = stored === "light" || stored === "dark" ? stored : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
