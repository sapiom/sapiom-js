<!doctype html>
<!-- data-product scopes the design-system's named "sapiom-studio" preset
     (compact IDE density, scarce green brand, neutral focus/selection). -->
<html lang="en" data-product="sapiom-studio">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Studio</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong one.
      // Resolution order must match web/src/lib/theme.ts (this can't import
      // it): the server-stamped data-display-mode wins — it is the persisted
      // setting, and in the desktop app it is the ONLY source, since that host
      // serves this page from a fresh ephemeral port (a new, empty origin
      // store) every launch — then this origin's localStorage, then the
      // pre-display-mode key, then dark.
      (function () {
        var el = document.documentElement;
        function known(value) {
          return value === "light" || value === "dark" || value === "system" ? value : null;
        }
        var mode =
          known(el.dataset.displayMode) ||
          known(localStorage.getItem("sapiom-harness-display-mode")) ||
          known(localStorage.getItem("sapiom-harness-theme")) ||
          "dark";
        el.dataset.displayMode = mode;
        el.dataset.theme =
          mode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
            : mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
