packages:
  - "packages/*"

# node-pty needs its postinstall (chmods spawn-helper +x); pnpm skips build
# scripts by default, which leaves it silently non-functional on fresh installs.
# esbuild needs its postinstall too. electron has no install script since v42 (it
# downloads its binary on the first run of its bin); listing it is harmless.
# @electron/rebuild recompiles node-pty against Electron's ABI during packaging.
onlyBuiltDependencies:
  - node-pty
  - electron
  - esbuild
  - "@electron/rebuild"
  - opencode-ai

# plist 3.1.1 (via @electron/osx-sign, @electron/universal, dmg-license) accepts
# an advised @xmldom/xmldom 0.9.x, and pnpm keeps a locked version that still
# satisfies the range. Raise only that line; plist 3.1.0's 0.8.x line is current.
overrides:
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ^0.9.12
patchedDependencies:
  "@assistant-ui/react-opencode@0.2.22": patches/@assistant-ui__react-opencode@0.2.22.patch
