packages:
  - "packages/*"

# pnpm skips dependency build scripts by default; without theirs these break silently (node-pty's spawn-helper stays non-executable).
# electron is absent on purpose: since v42 it downloads its binary on first run, not in postinstall.
onlyBuiltDependencies:
  - node-pty
  - esbuild
  - "@electron/rebuild"
  - opencode-ai

# Upgrade the @electron/rebuild that electron-builder bundles (app-builder-lib
# pins 3.6.1, which drags node-gyp@9.4.1 — its VS detection can't parse recent
# VS2022 on the windows-latest runner, so the node-pty rebuild fails). 3.7.x
# ships a modern, COMPATIBLE node-gyp@10 (detects VS2022) — overriding rebuild
# itself, rather than forcing node-gyp@10 under the old 3.6.1, avoids the
# cross-platform rebuild HANG that the bare node-gyp override caused.
overrides:
  "@electron/rebuild": ^3.7.0
patchedDependencies:
  "@assistant-ui/react-opencode@0.2.22": patches/@assistant-ui__react-opencode@0.2.22.patch
