packages:
  - "packages/*"

# node-pty needs its postinstall (chmods spawn-helper +x); pnpm skips build
# scripts by default, which leaves it silently non-functional on fresh installs.
# electron/esbuild need their postinstall too (electron downloads its binary;
# without this the desktop app's `electron` runtime is missing). @electron/rebuild
# recompiles node-pty against Electron's ABI during packaging.
onlyBuiltDependencies:
  - node-pty
  - electron
  - esbuild
  - "@electron/rebuild"
  - opencode-ai

# Upgrade the @electron/rebuild that electron-builder bundles (app-builder-lib
# pins 3.6.1, which drags node-gyp@9.4.1 — its VS detection can't parse recent
# VS2022 on the windows-latest runner, so the node-pty rebuild fails). 3.7.x
# ships a modern, COMPATIBLE node-gyp@10 (detects VS2022) — overriding rebuild
# itself, rather than forcing node-gyp@10 under the old 3.6.1, avoids the
# cross-platform rebuild HANG that the bare node-gyp override caused.
overrides:
  "@electron/rebuild": ^3.7.0
  # Security floors for transitive dependencies (SAP-4715). Each key is scoped
  # to the major line a parent declares and floors it at the first release that
  # closes that line's open advisories, so no parent gets a major it did not ask
  # for. Some lines have no patched release in their own major and move up one:
  # fast-xml-parser@4, langsmith@0.3 and uuid@9/10 sit in
  # @sapiom/langchain-classic's dev-only @langchain/* 0.3 test graph, whose
  # tests cover the jump. toml@4 moves to 5 under effect, which the desktop app
  # ships; parse(input, options) remains available, but integers outside
  # JavaScript's safe range require the bigint option and must fit TOML's
  # signed 64-bit range.
  "body-parser@1": ^1.20.9
  "body-parser@2": ^2.4.0
  "brace-expansion@1": ^1.1.21
  "brace-expansion@2": ^2.1.7
  "brace-expansion@5": ^5.0.12
  "browserslist@4": ^4.28.7
  "dompurify@3": ^3.4.17
  "fast-uri@3": ^3.1.9
  "fast-xml-parser@4": ^5.7.0
  "handlebars@4": ^4.7.10
  "hono@4": ^4.13.11
  "ip-address@10": ^10.7.4
  "js-yaml@3": ^3.15.2
  "js-yaml@4": ^4.3.2
  "langsmith@0.3": ^0.6.0
  "postcss@8": ^8.5.23
  "proxy-addr@2": ^2.0.8
  "qs@6": ^6.16.1
  "toml@4": ^5.0.1
  "uuid@9": ^11.1.1
  "uuid@10": ^11.1.1
patchedDependencies:
  "@assistant-ui/react-opencode@0.2.22": patches/@assistant-ui__react-opencode@0.2.22.patch
