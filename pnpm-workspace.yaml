packages:
  - "packages/*"

# node-pty needs its postinstall (chmods spawn-helper +x); pnpm skips build
# scripts by default, which leaves it silently non-functional on fresh installs.
# electron/esbuild need their postinstall too (electron downloads its binary;
# without this the desktop app's `electron` runtime is missing). @electron/rebuild
# recompiles node-pty against Electron's ABI during packaging.
onlyBuiltDependencies:
  - node-pty
  - electron
  - esbuild
  - "@electron/rebuild"
  - opencode-ai

# Upgrade the @electron/rebuild that electron-builder bundles (app-builder-lib
# pins 3.6.1, which drags node-gyp@9.4.1 — its VS detection can't parse recent
# VS2022 on the windows-latest runner, so the node-pty rebuild fails). 3.7.x
# ships a modern, COMPATIBLE node-gyp@10 (detects VS2022) — overriding rebuild
# itself, rather than forcing node-gyp@10 under the old 3.6.1, avoids the
# cross-platform rebuild HANG that the bare node-gyp override caused.
overrides:
  "@electron/rebuild": ^3.7.0
  # Lift transitive dependencies to the latest release of the major line their
  # parents declare. Keys are scoped to that line so a parent never gets a
  # major it did not ask for, and newer majors stay free for regular upgrades.
  # Exceptions: fast-xml-parser@4, langsmith@0.3 and uuid@9/10 sit in dev-only
  # graphs whose tests cover the jump. toml@4 moves to 5 under effect, which the
  # desktop app ships; its parse API is unchanged. @hono/node-server@1 moves to
  # 2.x, which @modelcontextprotocol/sdk's own range allows.
  "baseline-browser-mapping@2": ^2.11.34
  "body-parser@1": ^1.20.9
  "body-parser@2": ^2.4.0
  "brace-expansion@1": ^1.1.21
  "brace-expansion@2": ^2.1.7
  "brace-expansion@5": ^5.0.12
  "browserslist@4": ^4.29.5
  "dompurify@3": ^3.4.17
  "fast-uri@3": ^3.1.9
  "fast-xml-parser@4": ^5.11.2
  "follow-redirects@1": ^1.16.2
  "handlebars@4": ^4.7.10
  "hono@4": ^4.13.16
  "@hono/node-server@1": ^2.1.6
  "ip-address@10": ^10.7.5
  "js-yaml@3": ^3.15.2
  "js-yaml@4": ^4.3.2
  "langsmith@0.3": ^0.11.7
  "nanoid@3": ^3.3.20
  "postcss@8": ^8.5.32
  "proxy-addr@2": ^2.0.8
  "qs@6": ^6.17.1
  "source-map-js@1": ^1.2.2
  "toml@4": ^5.0.1
  "uuid@9": ^11.1.1
  "uuid@10": ^11.1.1
patchedDependencies:
  "@assistant-ui/react-opencode@0.2.22": patches/@assistant-ui__react-opencode@0.2.22.patch
