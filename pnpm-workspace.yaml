packages:
  - "packages/*"

# Allow node-pty's install scripts so native binaries can be built when no
# matching prebuild exists; pnpm otherwise skips dependency build scripts.
# esbuild needs its postinstall too. electron has no install script since v42 (it
# downloads its binary on the first run of its bin); listing it is harmless.
# @electron/rebuild recompiles node-pty against Electron's ABI during packaging.
onlyBuiltDependencies:
  - node-pty
  - electron
  - esbuild
  - "@electron/rebuild"
  - opencode-ai

# Exclude affected @xmldom/xmldom 0.9.x versions accepted by plist 3.1.1
# (via @electron/osx-sign and @electron/universal); pnpm can retain a locked
# version that satisfies the range. Leave plist 3.1.0's 0.8.x line unchanged.
overrides:
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ^0.9.12
patchedDependencies:
  "@assistant-ui/react-opencode@0.2.22": patches/@assistant-ui__react-opencode@0.2.22.patch
