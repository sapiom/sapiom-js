<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insight report dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #fcfcfb;
        --card: #ffffff;
        --line: #e6e5e1;
        --text: #0b0b0b;
        --text-2: #52514e;
        --text-3: #7c7b77;
        --series-1: #2a78d6;
        --track: #eef1f5;
        --good: #0ca30c;
        --warning: #fab219;
        --serious: #ec835a;
        --critical: #d03b3b;
        --chip: #f3f2ef;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --surface: #1a1a19;
          --card: #222221;
          --line: #34342f;
          --text: #ffffff;
          --text-2: #c3c2b7;
          --text-3: #8f8e86;
          --series-1: #3987e5;
          --track: #2c2c2a;
          --chip: #2a2a28;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      code,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 24px 28px;
      }
      header.top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-3);
        margin: 0 0 2px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.2;
        margin: 0;
        font-weight: 650;
      }
      .facts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .chip {
        background: var(--chip);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        color: var(--text-2);
        white-space: nowrap;
      }
      .chip b {
        color: var(--text);
        font-weight: 600;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        min-width: 0;
      }
      .kpi .label {
        font-size: 12px;
        color: var(--text-2);
        margin: 0 0 6px;
      }
      .kpi .value {
        font-size: 22px;
        font-weight: 650;
        line-height: 1.1;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-wrap: anywhere;
      }
      .kpi .sub {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--text-3);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        display: inline-block;
      }
      .sev-low .dot {
        background: var(--good);
      }
      .sev-medium .dot {
        background: var(--warning);
      }
      .sev-high .dot {
        background: var(--serious);
      }
      .sev-critical .dot {
        background: var(--critical);
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
      h2 {
        font-size: 13px;
        margin: 0 0 10px;
        color: var(--text-2);
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .report {
        max-height: 520px;
        overflow: auto;
      }
      .md h2,
      .md h3 {
        font-size: 15px;
        margin: 14px 0 6px;
        color: var(--text);
        font-weight: 650;
      }
      .md h2:first-child,
      .md h3:first-child {
        margin-top: 0;
      }
      .md p {
        margin: 0 0 8px;
      }
      .md ul {
        margin: 0 0 8px;
        padding-left: 18px;
      }
      .md li {
        margin: 2px 0;
      }
      .md code {
        background: var(--chip);
        border-radius: 4px;
        padding: 0 4px;
      }
      .md a {
        color: var(--series-1);
      }
      .md em {
        color: var(--text-2);
      }
      .md .note {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--text-3);
      }
      .anomaly p {
        margin: 0;
        font-size: 14px;
      }
      .anomaly .meta {
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-3);
      }
      .chart {
        display: grid;
        gap: 6px;
      }
      .row {
        display: grid;
        grid-template-columns: 128px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 24px;
        border-radius: 6px;
      }
      .row:hover {
        background: var(--chip);
      }
      .row .name {
        font-size: 12px;
        color: var(--text-2);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .bar {
        position: relative;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row .fill {
        height: 16px;
        background: var(--series-1);
        border-radius: 0 4px 4px 0;
        min-width: 0;
      }
      .row .num {
        font-size: 12px;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .axis {
        margin: 6px 0 0 138px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-3);
        padding-top: 3px;
      }
      .source {
        margin: 14px 0 0;
        font-size: 12px;
        color: var(--text-3);
      }
      .source b {
        color: var(--text-2);
        font-weight: 600;
      }
      .empty {
        color: var(--text-3);
        font-style: italic;
      }
      figure.chartimg {
        margin: 10px 0 0;
      }
      figure.chartimg img {
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div>
          <p class="eyebrow">Scheduled Metrics Report</p>
          <h1>Insight report dashboard</h1>
        </div>
        <div class="facts" id="facts"></div>
      </header>

      <section class="kpis" id="kpis" aria-label="Key figures"></section>

      <div class="grid">
        <section class="card report" aria-labelledby="report-h">
          <h2 id="report-h">Latest report</h2>
          <div class="md" id="report"></div>
        </section>
        <div class="stack">
          <section class="card anomaly" aria-labelledby="anomaly-h">
            <h2 id="anomaly-h">Anomaly flagged</h2>
            <div id="anomaly"></div>
          </section>
          <section class="card" aria-labelledby="followup-h">
            <h2 id="followup-h">Follow-up read</h2>
            <div id="followup"></div>
          </section>
        </div>
      </div>

      <p class="source" id="source"></p>
    </div>

    <script>
      // Everything below renders `/api/report` — the agent's own terminal
      // output — into the page. No number here is computed by the dashboard
      // except bar widths, which are proportional to the values the run returned.

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      /** Inline markdown on an already-escaped line: code, bold, emphasis, https links. */
      function inline(text) {
        return text
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|\s)_([^_]+)_(?=\s|$|[.,;:])/g, "$1<em>$2</em>")
          .replace(
            /\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,
            '<a href="$2" target="_blank" rel="noreferrer">$1</a>',
          );
      }

      /**
       * The small markdown subset the agent writes: `##`/`###` headings, `-`
       * bullets, blank-line paragraphs, and the inline forms above. Escapes
       * first, so nothing the model wrote can become markup.
       */
      function renderMarkdown(md) {
        const out = [];
        let list = null;
        let para = [];
        const flushPara = () => {
          if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`);
          para = [];
        };
        const flushList = () => {
          if (list) out.push(`<ul>${list.join("")}</ul>`);
          list = null;
        };
        for (const raw of String(md).split(/\r?\n/)) {
          const line = esc(raw.trim());
          if (!line) {
            flushPara();
            flushList();
            continue;
          }
          const heading = /^(#{1,6})\s+(.*)$/.exec(line);
          if (heading) {
            flushPara();
            flushList();
            const level = Math.min(heading[1].length + 1, 3);
            out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
            continue;
          }
          const bullet = /^[-*]\s+(.*)$/.exec(line);
          if (bullet) {
            flushPara();
            list = list ?? [];
            list.push(`<li>${inline(bullet[1])}</li>`);
            continue;
          }
          flushList();
          para.push(line);
        }
        flushPara();
        flushList();
        return out.join("");
      }

      const fmtWhen = (iso) => {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return esc(iso);
        return d.toLocaleString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "UTC",
          timeZoneName: "short",
        });
      };
      const fmtNum = (n) =>
        typeof n === "number" ? n.toLocaleString("en-US") : esc(n ?? "—");
      const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : "—");

      function kpi(label, value, sub, cls = "") {
        return `<article class="card kpi ${cls}"><p class="label">${label}</p><div class="value">${value}</div>${
          sub ? `<p class="sub">${sub}</p>` : ""
        }</article>`;
      }

      function renderBars(series) {
        const points = Array.isArray(series?.points) ? series.points : [];
        if (points.length === 0) {
          return `<p class="empty">No follow-up read in this run.</p>`;
        }
        const max = Math.max(1, ...points.map((p) => Number(p.value) || 0));
        const rows = points
          .map((p) => {
            const v = Number(p.value) || 0;
            const pct = (v / max) * 100;
            return `<div class="row" title="${esc(p.label)}: ${fmtNum(v)}"><span class="name">${esc(p.label)}</span><span class="bar"><span class="fill" style="width:${pct.toFixed(2)}%"></span><span class="num">${fmtNum(v)}</span></span></div>`;
          })
          .join("");
        return `<h3 style="font-size:14px;margin:0 0 10px">${inline(esc(series.name ?? ""))}</h3><div class="chart">${rows}</div><div class="axis"><span>0</span><span>${fmtNum(max)}</span></div>`;
      }

      function render({ source, output }) {
        const o = output ?? {};
        const anomaly = o.anomaly ?? {};
        const sev = String(anomaly.severity ?? "").toLowerCase();

        document.getElementById("facts").innerHTML = [
          o.schedule
            ? `<span class="chip">Schedule <b class="mono">${esc(o.schedule)}</b></span>`
            : "",
          `<span class="chip">Snapshot <b>${fmtWhen(o.generatedAt)}</b></span>`,
        ].join("");

        const delivery = o.delivered
          ? [`Emailed`, `to ${esc(o.to ?? "")}`]
          : [
              `Returned inline`,
              o.reason === "dry-run"
                ? "Dry run — nothing sent"
                : "No recipient set — nothing sent",
            ];

        document.getElementById("kpis").innerHTML = [
          kpi(
            "Anomaly severity",
            `<span class="dot" aria-hidden="true"></span>${cap(sev)}`,
            anomaly.metric ? `in ${esc(anomaly.metric)}` : "",
            sev ? `sev-${esc(sev)}` : "",
          ),
          kpi(
            "Flagged table",
            anomaly.table ? `<code>${esc(anomaly.table)}</code>` : "—",
            anomaly.table
              ? "drilled into by the follow-up read"
              : "no table named",
          ),
          kpi(
            "Metrics snapshotted",
            fmtNum(o.metricCount),
            "read-only queries",
          ),
          kpi("Delivery", delivery[0], delivery[1]),
        ].join("");

        document.getElementById("report").innerHTML =
          (o.report
            ? renderMarkdown(o.report) +
              (o.chartUrl
                ? `<figure class="chartimg"><img src="${esc(o.chartUrl)}" alt="Rendered chart from the run" onerror="this.parentNode.remove()" /></figure>`
                : "")
            : `<p class="empty">This run returned no report.</p>`) +
          // The run's own account of what it did and did not do (nothing
          // emailed, demo data, follow-up skipped) belongs with the report it
          // qualifies, not in the page chrome.
          (o.note ? `<p class="note">${inline(esc(o.note))}</p>` : "");

        document.getElementById("anomaly").innerHTML = anomaly.description
          ? `<p>${inline(esc(anomaly.description))}</p><p class="meta">Chosen by the model from the snapshot's own labels; the follow-up query targets it.</p>`
          : `<p class="empty">No anomaly in this run.</p>`;

        document.getElementById("followup").innerHTML = renderBars(o.followUp);

        const src = source ?? {};
        const where =
          src.kind === "live"
            ? `Live — latest completed run`
            : `Captured zero-setup run`;
        document.getElementById("source").innerHTML =
          `<b>${where}</b> · agent run <span class="mono">#${esc(src.executionId ?? "?")}</span> · finished ${fmtWhen(src.finishedAt)}` +
          (src.liveError
            ? ` · <span class="empty">live read failed (${esc(src.liveError)}); showing the captured run</span>`
            : "");
      }

      fetch("/api/report", { cache: "no-store" })
        .then((r) => r.json())
        .then(render)
        .catch((err) => {
          document.getElementById("report").innerHTML =
            `<p class="empty">Could not load the report: ${esc(err?.message ?? err)}</p>`;
        })
        .finally(() => {
          document.body.dataset.ready = "true";
        });
    </script>
  </body>
</html>
