<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draft grading dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #fcfcfb;
        --card: #ffffff;
        --line: #e6e5e1;
        --text: #0b0b0b;
        --text-2: #52514e;
        --text-3: #7c7b77;
        --accent: #2a78d6;
        --chip: #f3f2ef;
        --track: #eeede9;
        --pass: #1f8a4c;
        --pass-bg: #e7f4ec;
        --fail: #b8620b;
        --fail-bg: #fbefe1;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --surface: #1a1a19;
          --card: #222221;
          --line: #34342f;
          --text: #ffffff;
          --text-2: #c3c2b7;
          --text-3: #8f8e86;
          --accent: #3987e5;
          --chip: #2a2a28;
          --track: #34342f;
          --pass: #4cc27d;
          --pass-bg: #1d3326;
          --fail: #f0a04b;
          --fail-bg: #3a2a18;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      code,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 24px 28px;
      }
      header.top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-3);
        margin: 0 0 2px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.2;
        margin: 0;
        font-weight: 650;
      }
      .facts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 60%;
      }
      .chip {
        background: var(--chip);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        color: var(--text-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .chip b {
        color: var(--text);
        font-weight: 600;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        min-width: 0;
      }
      .kpi .label {
        font-size: 12px;
        color: var(--text-2);
        margin: 0 0 6px;
      }
      .kpi .value {
        font-size: 20px;
        font-weight: 650;
        line-height: 1.1;
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }
      .kpi .sub {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--text-3);
      }
      .pass {
        color: var(--pass);
      }
      .fail {
        color: var(--fail);
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .facts {
          max-width: 100%;
          justify-content: flex-start;
        }
      }
      h2 {
        font-size: 13px;
        margin: 0 0 10px;
        color: var(--text-2);
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      h3 {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-3);
        font-weight: 600;
        margin: 0 0 4px;
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .draft-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .badge {
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge.pass {
        background: var(--pass-bg);
      }
      .badge.fail {
        background: var(--fail-bg);
      }
      .draft {
        margin: 4px 0 0;
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        font-size: 18px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .note {
        margin: 14px 0 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--text-3);
      }
      .meter {
        position: relative;
        height: 12px;
        border-radius: 999px;
        background: var(--track);
        margin: 26px 0 6px;
      }
      .meter .fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 999px;
      }
      .meter .fill.pass {
        background: var(--pass);
      }
      .meter .fill.fail {
        background: var(--fail);
      }
      .meter .bar {
        position: absolute;
        top: -6px;
        bottom: -6px;
        width: 2px;
        margin-left: -1px;
        background: var(--text);
      }
      .meter .bar span {
        position: absolute;
        bottom: calc(100% + 2px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: var(--text-2);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .scale {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .rationale {
        margin: 12px 0 0;
        font-size: 13px;
      }
      .rationale::before {
        content: "Judge: ";
        color: var(--text-3);
      }
      .brief {
        margin: 0 0 12px;
        font-size: 13px;
      }
      .criteria {
        margin: 0;
        padding-left: 18px;
        font-size: 13px;
        display: grid;
        gap: 3px;
      }
      .tag {
        font-size: 11px;
        color: var(--text-3);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
      }
      .source {
        margin: 14px 0 0;
        font-size: 12px;
        color: var(--text-3);
      }
      .source b {
        color: var(--text-2);
        font-weight: 600;
      }
      .muted {
        color: var(--text-3);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div>
          <p class="eyebrow">Self-Editing Writer</p>
          <h1>Draft grading dashboard</h1>
        </div>
        <div class="facts" id="facts"></div>
      </header>

      <section class="kpis" id="kpis" aria-label="Key figures"></section>

      <div class="grid">
        <section class="card" aria-labelledby="draft-h">
          <div class="draft-head">
            <h2 id="draft-h">Published draft</h2>
            <span id="badge"></span>
          </div>
          <div id="draft"></div>
          <div id="note"></div>
        </section>
        <div class="stack">
          <section class="card" aria-labelledby="verdict-h">
            <h2 id="verdict-h">The judge's grade</h2>
            <div id="verdict"></div>
          </section>
          <section class="card" aria-labelledby="task-h">
            <h2 id="task-h">What it was asked to write</h2>
            <div id="task"></div>
          </section>
        </div>
      </div>

      <p class="source" id="source"></p>
    </div>

    <script>
      // Everything below renders `/api/run`, the agent's own terminal output
      // plus the brief and rubric that run was given, into the page. The only
      // things computed here are the draft's word count and the score's
      // distance from the pass bar, both from values the run returned.

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      /** Inline markdown on an already-escaped line: code and bold. */
      const inline = (text) =>
        text
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

      const fmtWhen = (iso) => {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return esc(iso);
        return d.toLocaleString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "UTC",
          timeZoneName: "short",
        });
      };
      const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : null);
      const fmtScore = (v) => (v === null ? "—" : v.toFixed(2));
      const pct = (v) => `${Math.min(1, Math.max(0, v)) * 100}%`;
      const words = (s) =>
        String(s ?? "")
          .trim()
          .split(/\s+/)
          .filter(Boolean).length;

      function kpi(label, value, sub) {
        return `<article class="card kpi"><p class="label">${label}</p><div class="value">${value}</div>${
          sub ? `<p class="sub">${sub}</p>` : ""
        }</article>`;
      }

      /**
       * A rubric written as sentences ("Under 120 words. Noir tone: ...") is
       * shown one criterion per line; one written any other way is shown as
       * it came. These are what the judge scored against, not per-criterion
       * results: the judge returns one score for the whole draft.
       */
      function renderRubric(rubric) {
        const parts = String(rubric)
          .split(/(?<=[.!?])\s+(?=[A-Z])/)
          .map((p) => p.trim())
          .filter(Boolean);
        if (parts.length < 2) return `<p class="brief">${esc(rubric)}</p>`;
        return `<ol class="criteria">${parts
          .map((p) => `<li>${esc(p)}</li>`)
          .join("")}</ol>`;
      }

      function render({ source, task, output }) {
        const o = output ?? {};
        const src = source ?? {};
        const t = task ?? {};
        const score = num(o.score);
        const bar = num(o.threshold);
        const attempts = num(o.iterations);
        const max = num(t.maxIterations);
        const passed = o.passed === true;
        const tone = passed ? "pass" : "fail";
        const count = words(o.draft);

        document.getElementById("facts").innerHTML = [
          `<span class="chip" title="${esc(t.brief ?? "")}">Brief <b>${t.sampleBrief ? "built-in sample" : "your own"}</b></span>`,
          `<span class="chip">Rubric <b>${t.sampleRubric ? "built-in sample" : "your own"}</b></span>`,
          `<span class="chip">Finished <b>${fmtWhen(src.finishedAt)}</b></span>`,
        ].join("");

        const margin = score !== null && bar !== null ? score - bar : null;
        document.getElementById("kpis").innerHTML = [
          kpi(
            "Verdict",
            `<span class="${tone}">${passed ? "Passed" : "Did not pass"}</span>`,
            passed
              ? "cleared the rubric, then published"
              : "published the best draft after the attempt cap",
          ),
          kpi(
            "Judge score",
            fmtScore(score),
            margin === null
              ? "no pass bar returned"
              : `pass bar ${fmtScore(bar)} · ${margin >= 0 ? "+" : "−"}${Math.abs(margin).toFixed(2)} ${margin >= 0 ? "over" : "under"}`,
          ),
          kpi(
            "Attempts",
            attempts === null
              ? "—"
              : max === null
                ? String(attempts)
                : `${attempts} of ${max}`,
            attempts === 1
              ? "first draft, no revision needed"
              : attempts === null
                ? ""
                : `${attempts - 1} revision${attempts - 1 === 1 ? "" : "s"} after the judge's critique`,
          ),
          kpi(
            "Length",
            `${count} words`,
            "counted here from the published draft",
          ),
        ].join("");

        document.getElementById("badge").innerHTML =
          `<span class="badge ${tone}">${passed ? "Cleared the bar" : "Below the bar"}</span>`;
        document.getElementById("draft").innerHTML =
          typeof o.draft === "string" && o.draft.trim()
            ? `<p class="draft">${esc(o.draft.trim())}</p>`
            : `<p class="muted">This run returned no draft.</p>`;

        // The run's own account of what it did (graded the built-in sample,
        // hit the attempt cap) belongs under the draft it qualifies.
        document.getElementById("note").innerHTML = o.note
          ? `<p class="note">${inline(esc(o.note))}</p>`
          : "";

        document.getElementById("verdict").innerHTML =
          (score === null
            ? `<p class="muted">This run returned no score.</p>`
            : `<div class="meter" role="img" aria-label="Score ${fmtScore(score)} against a pass bar of ${fmtScore(bar)}">
                 <div class="fill ${tone}" style="width:${pct(score)}"></div>
                 ${bar === null ? "" : `<div class="bar" style="left:${pct(bar)}"><span>pass bar ${fmtScore(bar)}</span></div>`}
               </div>
               <div class="scale"><span>0.00</span><span>1.00</span></div>`) +
          (o.rationale ? `<p class="rationale">${esc(o.rationale)}</p>` : "");

        document.getElementById("task").innerHTML = `
          <h3>Brief ${t.sampleBrief ? `<span class="tag">· built-in sample</span>` : ""}</h3>
          <p class="brief">${esc(t.brief ?? "—")}</p>
          <h3>Rubric the judge scored against ${t.sampleRubric ? `<span class="tag">· built-in sample</span>` : ""}</h3>
          ${renderRubric(t.rubric ?? "—")}`;

        const where =
          src.kind === "live"
            ? `Live — latest completed run`
            : `Captured zero-setup run`;
        document.getElementById("source").innerHTML =
          `<b>${where}</b> · agent run <span class="mono">#${esc(src.executionId ?? "?")}</span> · finished ${fmtWhen(src.finishedAt)}` +
          (src.liveError
            ? ` · <span class="muted">live read failed (${esc(src.liveError)}); showing the captured run</span>`
            : "");
      }

      fetch("/api/run", { cache: "no-store" })
        .then((r) => r.json())
        .then(render)
        .catch((err) => {
          document.getElementById("draft").innerHTML =
            `<p class="muted">Could not load the run: ${esc(err?.message ?? err)}</p>`;
        })
        .finally(() => {
          document.body.dataset.ready = "true";
        });
    </script>
  </body>
</html>
