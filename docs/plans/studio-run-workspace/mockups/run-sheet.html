<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio Run Sheet Mockup</title>
<style>
  :root { color-scheme: dark; font: 14px/1.45 Inter, system-ui, sans-serif; background:#17191d; color:#f4f4f5 }
  * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(120deg,#17191d,#24272d) }
  .sheet { width:min(520px,calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; background:#202329; border:1px solid #3b3f47; border-radius:16px; box-shadow:0 24px 90px #0009 }
  header,.actions { display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid #343840 } .actions { border:0; border-top:1px solid #343840; justify-content:flex-end }
  h1 { font-size:16px; margin:0; flex:1 } .target { display:flex; padding:3px; border-radius:9px; background:#15171a } .target button { border:0; color:#aaa; background:transparent; padding:6px 10px; border-radius:7px } .target .on { color:#fff; background:#343840 }
  main { padding:20px; display:grid; gap:18px } label { display:grid; gap:7px; color:#d7d9de; font-weight:600 } small { color:#959aa4; font-weight:400 }
  input,textarea { width:100%; color:#fff; background:#181a1e; border:1px solid #414650; border-radius:9px; padding:10px 12px; font:inherit } textarea { min-height:96px; font-family:ui-monospace,monospace }
  .row { display:flex; justify-content:space-between; gap:16px; align-items:center } .switch { width:38px; height:22px; border-radius:99px; background:#555b65; position:relative }.switch:after { content:""; width:16px;height:16px;border-radius:50%;background:white;position:absolute;left:3px;top:3px }
  button { cursor:pointer }.quiet { color:#aeb3bd;background:transparent;border:0;padding:8px }.primary { border:0;border-radius:9px;background:#f4f4f5;color:#15171a;font-weight:700;padding:10px 16px }
</style>
<body>
  <section class="sheet" role="dialog" aria-label="Run newsletter-autopilot">
    <header><h1>Run newsletter-autopilot</h1><div class="target"><button class="on">Local</button><button>Cloud</button></div><button class="quiet">×</button></header>
    <main>
      <p style="margin:0;color:#aeb3bd">Test with stubbed Sapiom capabilities. Your agent code still runs locally.</p>
      <label>Niche <input value="indie game development" /><small>The topic to research and write about on each tick.</small></label>
      <label>Newsletter name <input value="Weekly Autopilot" /><small>Masthead shown in the subject and header.</small></label>
      <label>Subscribers <textarea>[ ]</textarea><small>Optional email addresses. Arrays remain directly editable.</small></label>
      <div class="row"><span><b>Dry run</b><br /><small>Render the issue but skip the real send.</small></span><span class="switch"></span></div>
      <div class="row"><button class="quiet">Edit whole input as JSON</button><button class="quiet">Reset to defaults</button></div>
    </main>
    <div class="actions"><button class="quiet">Cancel</button><button class="primary">Test locally</button></div>
  </section>
</body>
</html>
